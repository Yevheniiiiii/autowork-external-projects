name: AutoWork External Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover projects
        run: python3 external_europe_runner.py

      - name: Save results
        run: |
          git config user.name "AutoWork"
          git config user.email "autowork@users.noreply.github.com"
          git add external_projects.json
          git diff --cached --quiet || git commit -m "Update external projects"
          git push
